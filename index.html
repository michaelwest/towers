<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101f24"><title>Lagoon Guard · Defend the floating city</title><link rel="stylesheet" href="./style.css"></head>
<body>
<main>
<div class="game-layout"><section class="battle-panel" aria-label="Game battlefield"><div class="canvas-wrap"><canvas id="board" width="720" height="730" aria-label="Winding canal battlefield. Select a tower, then tap a marked mooring to build."></canvas><div class="map-tip" id="map-tip">✧ &nbsp; Tap a marked mooring to build</div><div id="result" class="result" hidden><span id="result-symbol">♜</span><h2 id="result-title"></h2><p id="result-copy"></p><button id="again">Defend again <i class="arrow" aria-hidden="true"></i></button></div></div></section>
<aside class="command-panel"><section class="stats"><div><span class="stat-label">TREASURY</span><strong><i class="coin">◈</i> <span id="gold">220</span><small>gold</small></strong></div><div><span class="stat-label">CITY INTEGRITY</span><strong><i class="heart">♥</i> <span id="health">20</span><small>/ 20</small></strong></div><div class="health-track"><span id="health-fill"></span></div></section>
<section class="arsenal"><div id="tower-cards">
<button class="tower-card selected" data-type="bolt" aria-pressed="true"><span class="tower-art bolt">♜</span><span class="tower-copy"><b>Ballista <span class="type-tag">PRECISION</span></b><span class="tower-metrics">19 DAMAGE <i>·</i> FAST · ANTI-AIR</span></span><span class="price">◈ 65</span></button>
<button class="tower-card" data-type="splash" aria-pressed="false"><span class="tower-art splash">✹</span><span class="tower-copy"><b>Cannon <span class="type-tag">SPLASH</span></b><span class="tower-metrics">29 DAMAGE <i>·</i> GROUND ONLY</span></span><span class="price">◈ 110</span></button>
<button class="tower-card" data-type="frost" aria-pressed="false"><span class="tower-art frost">✧</span><span class="tower-copy"><b>Freeze <span class="type-tag">SLOW</span></b><span class="tower-metrics">48% SLOW <i>·</i> ANTI-AIR</span></span><span class="price">◈ 85</span></button></div><button class="tower-card dam-card" id="dam-tool" aria-pressed="false"><span class="dam-art" aria-hidden="true">▤</span><span class="tower-copy"><b>Dam <span class="type-tag">ROUTE</span></b><span class="tower-metrics">CLOSE A CANAL</span></span><span class="price" id="dam-price">◈ 125</span></button><div id="tower-detail" hidden><div><b id="detail-title"></b><button id="close-detail" aria-label="Close tower details">×</button></div><p id="detail-copy"></p><section id="upgrade-effects" hidden><table id="upgrade-stats" aria-label="Tower stats and next upgrade"></table><p id="upgrade-traits"></p></section><button id="upgrade"></button><p id="upgrade-status" role="status" hidden></p><button id="sell">Sell tower</button></div></section>
<section class="wave-control"><button id="start" class="start-button">Launch wave <span><i class="arrow" aria-hidden="true"></i></span></button><div class="play-controls"><button id="pause" disabled>Ⅱ &nbsp; Pause</button><button id="speed">1× &nbsp; Speed</button><button id="restart">↻ &nbsp; Reset</button></div></section>

</aside></div>
</main>

<script type="module" src="./app.js"></script></body></html>
